# Local dev services only. Production images come in Phase 5.
name: gbam

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gbam
      POSTGRES_PASSWORD: gbam
      POSTGRES_DB: gbam
    ports:
      - "5433:5432" # 5433: a native Postgres often owns 5432 on dev machines
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gbam"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
